name: FunPay bot

on:
  schedule:
    - cron: "7,37 * * * *"   # backup start; normally each run starts the next one itself
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (do not send messages)"
        type: boolean
        default: false

concurrency:
  group: funpay-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run bot
        env:
          GOLDEN_KEY: ${{ secrets.GOLDEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          RUN_MINUTES: "330"
        run: node bot.mjs

      - name: Start the next run
        if: success() && hashFiles('.restart') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
